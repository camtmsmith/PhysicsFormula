<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Formula Flashcards — 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F6F8;
    --card:#FCFCFB;
    --ink:#1A2432;
    --muted:#6B7688;
    --line:rgba(26,36,50,.10);
    --grid:rgba(26,36,50,.045);
    --cardW:340px;
    --cardH:238px;
    --radius:14px;
    --shadow:0 1px 2px rgba(26,36,50,.05), 0 10px 24px -14px rgba(26,36,50,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #EEF1F6 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 clamp(16px,4vw,48px) 72px;
  }

  /* ---------- Masthead ---------- */
  header.masthead{
    max-width:1180px;margin:0 auto;padding:44px 4px 8px;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  h1{
    font-family:"Fraunces",Georgia,serif;font-weight:600;
    font-size:clamp(30px,4.4vw,46px);line-height:1.02;
    margin:.28em 0 .1em;letter-spacing:-.01em;
  }
  h1 em{font-style:italic;color:#3B5BA5}
  .sub{color:var(--muted);font-size:15px;max-width:60ch;margin:.2em 0 0}

  /* ---------- Controls ---------- */
  .controls{
    position:sticky;top:0;z-index:20;
    max-width:1180px;margin:22px auto 0;
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
    padding:12px 4px;
    background:linear-gradient(var(--paper) 68%, rgba(245,246,248,0));
  }
  .segmented{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .segmented button{
    border:0;background:transparent;color:var(--ink);
    font:600 13px/1 "Inter",sans-serif;padding:9px 15px;cursor:pointer;
  }
  .segmented button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .spacer{flex:1 1 auto}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    font:600 12px/1 "Inter",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999)}
  .chip[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--c,#999) 55%,var(--line));background:color-mix(in srgb,var(--c,#999) 10%,var(--card))}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:600 13px/1 "Inter",sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;
  }
  .btn:hover,.chip:hover,.segmented button:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}

  /* ---------- Deck ---------- */
  .deck{
    max-width:1180px;margin:10px auto 0;
    display:grid;grid-template-columns:repeat(auto-fill,var(--cardW));
    gap:22px;justify-content:center;
  }
  .card{
    width:var(--cardW);height:var(--cardH);
    perspective:1400px;cursor:pointer;background:transparent;border:0;padding:0;
    font-family:inherit;text-align:left;
  }
  .card:focus-visible{outline:3px solid #3B5BA5;outline-offset:4px;border-radius:calc(var(--radius) + 4px)}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:var(--radius);background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .face::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:19px 19px;background-position:-1px -1px;opacity:.9}
  .spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c);z-index:2}

  /* Front */
  .front{padding:16px 18px 14px 22px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;position:relative;z-index:1}
  .tag{font:600 10.5px/1.2 "Inter";letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
  .unit{font:500 10px/1 "Inter";letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .formula{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
    padding:2px 2px 4px;color:var(--ink);min-height:0}
  .formula mjx-container{max-width:100%}
  .foot{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
  .num{font:600 12px/1 "Fraunces",serif;color:var(--c)}
  .hint{font:500 10.5px/1 "Inter";color:var(--muted);letter-spacing:.04em;opacity:.85}

  /* Back */
  .back{transform:rotateY(180deg);padding:0}
  .back .head{background:var(--c);color:#fff;padding:11px 16px;position:relative;z-index:1}
  .back .head .k{font:600 9.5px/1 "Inter";letter-spacing:.16em;text-transform:uppercase;opacity:.82}
  .back .head .desc{font:600 13.5px/1.28 "Inter";margin-top:4px;letter-spacing:-.005em}
  .syms{position:relative;z-index:1;padding:11px 16px 12px;overflow:auto;flex:1;
    display:flex;flex-direction:column;gap:5px}
  .sym{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;
    font:400 11.5px/1.32 "Inter";color:#28323f}
  .sym .s{color:var(--c);font-weight:600;white-space:nowrap}
  .back .num{position:absolute;right:14px;bottom:10px;z-index:2;opacity:.7}
  .syms::-webkit-scrollbar{width:0}
  .syms{scrollbar-width:none}

  .count{max-width:1180px;margin:26px auto 0;color:var(--muted);font-size:12.5px;letter-spacing:.02em}

  /* ---------- Print: duplex-ready sheets ---------- */
  .printroot{display:none}
  @media print{
    @page{size:A4;margin:10mm}
    body{background:#fff;padding:0}
    header.masthead,.controls,.deck,.count{display:none !important}
    .printroot{display:block}
    .psheet{display:grid;grid-template-columns:repeat(3,60mm);grid-auto-rows:44mm;
      gap:3mm;justify-content:center;align-content:start;page-break-after:always}
    .psheet:last-child{page-break-after:auto}
    .pcard{width:60mm;height:44mm;border:.4mm solid #c8cdd6;border-radius:2.4mm;
      overflow:hidden;position:relative;display:flex;flex-direction:column}
    .pcard .pspine{position:absolute;left:0;top:0;bottom:0;width:1.6mm;background:var(--c)}
    .pf{padding:3mm 3mm 3mm 5mm;align-items:center;justify-content:center;text-align:center;height:100%;display:flex;flex-direction:column;gap:1.5mm}
    .pf .ptag{font:600 6pt/1 "Inter";letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
    .pf .pfx{flex:1;display:flex;align-items:center;justify-content:center}
    .pf .pnum{font:600 7pt/1 "Fraunces",serif;color:var(--c)}
    .pb{padding:0;height:100%;display:flex;flex-direction:column}
    .pb .phead{background:var(--c);color:#fff;padding:2mm 3mm;font:600 7.5pt/1.2 "Inter"}
    .pb .pk{font:600 5.2pt/1 "Inter";letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:.6mm}
    .pb .psy{padding:2mm 3mm;display:flex;flex-direction:column;gap:.9mm;overflow:hidden}
    .pb .prow{font:400 6.6pt/1.2 "Inter";color:#232c38}
    .pb .prow b{color:var(--c)}
    .pnote{font:400 8pt/1.3 "Inter";color:#555;text-align:center;margin:0 0 4mm}
  }
</style>
<script>
  window.MathJax={
    tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},
    svg:{fontCache:'global'},
    startup:{typeset:false}
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">QCAA Physics · Formula &amp; Data Book · 2025</div>
  <h1>Formula <em>Flashcards</em></h1>
  <p class="sub">Every senior physics formula, one per card. See the equation, recall what it means, then flip. Colour marks the syllabus topic.</p>
</header>

<div class="controls">
  <div class="segmented" role="group" aria-label="Show side">
    <button id="showF" aria-pressed="true">Show formulas</button>
    <button id="showE" aria-pressed="false">Show explanations</button>
  </div>
  <div class="chips" id="chips" aria-label="Filter by topic"></div>
  <div class="spacer"></div>
  <button class="btn" id="printBtn">Print deck</button>
</div>

<main class="deck" id="deck" aria-label="Flashcards"></main>
<p class="count" id="count"></p>

<div class="printroot" id="printroot"></div>

<script>
const C = {
  motion:"#3B5BA5",
  em:"#0E7C7B",
  rel:"#6B4E9E",
  quantum:"#B23A6E",
  standard:"#A5751F"
};
const TOPIC = {
  motion:{name:"Motion",unit:"Unit 3 · T1"},
  em:{name:"Electromagnetism",unit:"Unit 3 · T2"},
  rel:{name:"Special Relativity",unit:"Unit 4 · T1"},
  quantum:{name:"Quantum Physics",unit:"Unit 4 · T2"},
  standard:{name:"Standard Model",unit:"Unit 4 · T3"}
};

// s = symbol (TeX, no delimiters), m = meaning
const CARDS = [
  {t:"motion",sub:"Projectiles",f:"v_y = u_y + gt",d:"Final vertical velocity",
   sy:[["v_y","final velocity in the vertical (y) direction"],["u_y","starting velocity in the vertical (y) direction"],["g","acceleration due to gravity; near Earth's surface g = −9.8 m s⁻²"]]},
  {t:"motion",sub:"Projectiles",f:"s_y = u_y t + \\tfrac{1}{2} g t^2",d:"Final vertical displacement",
   sy:[["s_y","displacement in the vertical (y) direction"],["u_y","initial vertical velocity"],["g","acceleration due to gravity"],["t","time (s)"]]},
  {t:"motion",sub:"Projectiles",f:"v_y^{\\,2} = 2 g s_y + u_y^{\\,2}",d:"Final vertical velocity (also written v_y² = u_y² + 2g s_y)",
   sy:[["v_y","final vertical velocity"],["u_y","initial vertical velocity"],["s_y","vertical displacement"],["g","acceleration due to gravity"]]},
  {t:"motion",sub:"Projectiles",f:"v_x = u_x",d:"Final horizontal velocity equals the initial horizontal velocity",
   sy:[["v_x","final velocity in the horizontal (x) direction"],["u_x","starting velocity in the horizontal (x) direction"]]},
  {t:"motion",sub:"Projectiles",f:"s_x = u_x t",d:"Final horizontal displacement",
   sy:[["s_x","horizontal displacement, also called the ‘horizontal range’"],["u_x","initial horizontal velocity"],["t","time (s)"]]},
  {t:"motion",sub:"Projectiles",f:"u_y = u\\sin\\theta",d:"Vertical component of launch velocity (not in formula book)",
   sy:[["u_y","vertical component of initial velocity"],["u","launch speed"],["\\theta","launch angle above horizontal"]]},
  {t:"motion",sub:"Projectiles",f:"u_x = u\\cos\\theta",d:"Horizontal component of launch velocity (not in formula book)",
   sy:[["u_x","horizontal component of initial velocity"],["u","launch speed"],["\\theta","launch angle above horizontal"]]},
  {t:"motion",sub:"Inclined planes",f:"F_g = mg",d:"Gravitational force — the weight (F_W in Unit 2)",
   sy:[["F_g","gravitational force (weight) in newtons (N)"],["m","mass of object in the field in kilograms (kg)"],["g","gravitational field strength (N kg⁻¹) or accel. due to gravity (m s⁻²)"]]},
  {t:"motion",sub:"Circular motion",f:"v = \\dfrac{2\\pi r}{T}",d:"Centripetal (orbital) velocity",
   sy:[["v","velocity of revolving object (m s⁻¹)"],["r","radius of orbit (m)"],["T","period of revolution (s)"]]},
  {t:"motion",sub:"Circular motion",f:"a_c = \\dfrac{v^2}{r}",d:"Centripetal acceleration",
   sy:[["a_c","centripetal acceleration (m s⁻²)"],["v","velocity of revolving object (m s⁻¹)"],["r","radius of orbit (m)"]]},
  {t:"motion",sub:"Circular motion",f:"F_c = F_{net} = \\dfrac{m v^2}{r}",d:"Centripetal force",
   sy:[["F_c","centripetal force in newtons (N), also F_net"],["m","mass of revolving object (kg)"],["v","velocity of revolving object (m s⁻¹)"],["r","radius of orbit (m)"]]},
  {t:"motion",sub:"Orbits",f:"F_g = \\dfrac{GMm}{r^2}",d:"Newton’s universal law of gravitation",
   sy:[["F_g","gravitational force between two objects (N)"],["G","gravitational constant (see table)"],["M,\\,m","masses of the two objects (kg)"],["r","radial distance between objects (m)"]]},
  {t:"motion",sub:"Orbits",f:"g = \\dfrac{F}{m} = \\dfrac{GM}{r^2}",d:"Gravitational field strength, by force on a mass or by distance from a body",
   sy:[["g","field strength (N kg⁻¹ or m s⁻²)"],["m","mass of object in the field (kg)"],["M","mass of the astronomical body (kg)"],["G","gravitational constant"],["r","radial distance from centre of body (m)"]]},
  {t:"motion",sub:"Orbits",f:"\\dfrac{T_a^{\\,2}}{r_a^{\\,3}} = \\dfrac{T_b^{\\,2}}{r_b^{\\,3}} = \\dfrac{4\\pi^2}{GM}",d:"Law of periods — Kepler’s ratio T²/r³ is constant for one central star",
   sy:[["T","period of revolution about the central star (s)"],["r","radius of orbit (m)"],["M","mass of central star (kg)"],["G","gravitational constant"],["a,\\,b","subscripts denoting the two bodies"]]},

  {t:"em",sub:"Electrostatics",f:"F = \\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{Qq}{r^2} = \\dfrac{kQq}{r^2}",d:"Coulomb’s law — force between two charges r apart",
   sy:[["F","force between the charged particles (N)"],["\\tfrac{1}{4\\pi\\varepsilon_0}","Coulomb’s constant k"],["Q,\\,q","charge on each particle (C)"],["r","radial distance between charges (m)"]]},
  {t:"em",sub:"Electrostatics",f:"E = \\dfrac{F}{q} = \\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q}{r^2} = \\dfrac{kq}{r^2}",d:"Electric field strength, by force on a charge or by distance from a charge",
   sy:[["E","field strength (N C⁻¹)"],["F","force on a charged particle (N)"],["q","charge on particle (C)"],["k","Coulomb’s constant = 9×10⁹ N m² C⁻²"],["r","radial distance from the charge (m)"]]},
  {t:"em",sub:"Electrostatics",f:"V = \\dfrac{\\Delta U}{q}",d:"Electric potential difference when work is done on/by a charge",
   sy:[["V","electric potential in volts (V)"],["\\Delta U","change in electric PE — work done (J)"],["q","charge on particle (C)"]]},
  {t:"em",sub:"Magnetic fields",f:"B = \\dfrac{\\mu_0 I}{2\\pi r}",d:"Magnetic field about a straight current-carrying wire",
   sy:[["B","magnetic field strength in tesla (T)"],["\\mu_0","magnetic constant (see table)"],["I","current in the wire (A)"],["r","radial distance to the wire (m)"],["\\tfrac{\\mu_0}{2\\pi}","= 2×10⁻⁷ T m A⁻¹"]]},
  {t:"em",sub:"Magnetic fields",f:"B = \\mu_0 n I",d:"Magnetic field inside a solenoid",
   sy:[["B","magnetic field strength in tesla (T)"],["\\mu_0","magnetic constant"],["n","turns per unit length (m⁻¹)"],["I","current (A)"]]},
  {t:"em",sub:"Magnetic force",f:"F = BIL\\sin\\theta",d:"Force on a current-carrying wire (use Fleming’s left-hand rule)",
   sy:[["F","force on the wire (N)"],["B","magnetic field strength (T)"],["I","current in the wire (A)"],["L","length of wire in the field (m)"],["\\theta","angle between wire and field (°)"]]},
  {t:"em",sub:"Magnetic force",f:"F = qvB\\sin\\theta",d:"Force on a moving charged particle in a magnetic field",
   sy:[["F","force on the particle (N)"],["q","charge on particle (C)"],["v","velocity of particle (m s⁻¹)"],["B","magnetic field strength (T)"],["\\theta","angle between velocity and field (°)"]]},
  {t:"em",sub:"Induction",f:"\\phi = BA\\cos\\theta",d:"Magnetic flux through a loop",
   sy:[["\\phi","magnetic flux in weber (Wb)"],["B","magnetic field strength (T)"],["A","area of the loop (m²)"],["\\theta","angle between field and the loop’s normal (°)"]]},
  {t:"em",sub:"Induction",f:"\\text{emf} = -\\dfrac{N\\,\\Delta(BA_\\perp)}{\\Delta t}",d:"Faraday’s law of induction (1st version)",
   sy:[["\\text{emf}","electromotive force (V)"],["N","number of turns of wire in the coil"],["B","magnetic field strength (T)"],["A_\\perp","loop area perpendicular to the field (m²)"],["\\Delta t","time elapsed (s)"]]},
  {t:"em",sub:"Induction",f:"\\text{emf} = -N\\dfrac{\\Delta\\phi}{\\Delta t}",d:"Faraday’s law of induction (2nd version)",
   sy:[["\\text{emf}","electromotive force (V)"],["N","number of turns in the coil"],["\\Delta\\phi","change in magnetic flux (Wb)"],["\\Delta t","time elapsed (s)"]]},
  {t:"em",sub:"Transformers",f:"I_p V_p = I_s V_s",d:"Transformer — energy conservation relationship",
   sy:[["I_p","current in the primary coil (A)"],["I_s","current in the secondary coil (A)"],["V_p","voltage across the primary coil (V)"],["V_s","voltage across the secondary coil (V)"]]},
  {t:"em",sub:"Transformers",f:"\\dfrac{V_p}{V_s} = \\dfrac{n_p}{n_s}",d:"Ideal transformer — turns ratio",
   sy:[["V_p,\\,V_s","voltages across primary / secondary (V)"],["n_p","number of turns on the primary coil"],["n_s","number of turns on the secondary coil"]]},

  {t:"rel",sub:"Time & length",f:"t = \\dfrac{t_0}{\\sqrt{1 - \\dfrac{v^2}{c^2}}}",d:"Time dilation",
   sy:[["t","dilated (relativistic) time interval"],["t_0","proper time interval"],["v","speed of the frame relative to observer"],["c","speed of light in a vacuum"]]},
  {t:"rel",sub:"Time & length",f:"L = L_0\\sqrt{1 - \\dfrac{v^2}{c^2}}",d:"Length contraction",
   sy:[["L","contracted length (observer moving relative to object)"],["L_0","proper length (observer at rest to object)"],["v","relative speed"],["c","speed of light in a vacuum"]]},
  {t:"rel",sub:"Momentum",f:"p_v = \\dfrac{m_0 v}{\\sqrt{1 - \\dfrac{v^2}{c^2}}}",d:"Relativistic momentum",
   sy:[["p_v","relativistic momentum (kg m s⁻¹)"],["m_0","rest mass (kg)"],["v","speed of the object"],["c","speed of light in a vacuum"]]},
  {t:"rel",sub:"Mass–energy",f:"\\Delta E = \\Delta m\\, c^2",d:"Mass–energy equivalence",
   sy:[["\\Delta E","energy (J) for a given amount of mass"],["\\Delta m","rest mass (kg) converted to energy"],["c","speed of light in a vacuum (see table)"]]},

  {t:"quantum",sub:"Blackbody",f:"\\lambda_{max} = \\dfrac{b}{T}",d:"Wien’s displacement law",
   sy:[["\\lambda_{max}","wavelength of maximum intensity for blackbody radiation"],["b","Wien’s displacement constant (see table)"],["T","absolute temperature of the body (K)"]]},
  {t:"quantum",sub:"Photons",f:"E = hf = \\dfrac{hc}{\\lambda}",d:"Photon (blackbody) energy",
   sy:[["E","energy of a photon (J)"],["h","Planck’s constant"],["f","frequency of the light (Hz)"],["c","speed of light in a vacuum"],["\\lambda","wavelength of the light (m)"]]},
  {t:"quantum",sub:"Photoelectric",f:"E_k = hf - W",d:"Photoelectric effect — kinetic energy and work function",
   sy:[["E_k","max kinetic energy of ejected electrons (J)"],["h","Planck’s constant"],["f","frequency of incident light (Hz)"],["W","work function of the electron (J)"]]},
  {t:"quantum",sub:"Matter waves",f:"\\lambda = \\dfrac{h}{p}",d:"de Broglie / photon momentum",
   sy:[["\\lambda","wavelength (m)"],["h","Planck’s constant"],["p","momentum of the photon / particle (kg m s⁻¹)"]]},
  {t:"quantum",sub:"Bohr atom",f:"n\\lambda = 2\\pi r",d:"Standing-wave condition for an electron in a hydrogen atom",
   sy:[["n","atomic energy level"],["\\lambda","electron (Bohr) standing-wave wavelength (m)"],["r","Bohr radius of the electron orbit (m)"],["2\\pi r","circumference of the electron orbit (m)"]]},
  {t:"quantum",sub:"Bohr atom",f:"mvr = \\dfrac{nh}{2\\pi}",d:"Quantised angular momentum of an electron in an atom",
   sy:[["mvr","angular momentum of the electron, symbol L (kg m² s⁻¹)"],["m","mass of the electron (kg)"],["v","velocity of the electron (m s⁻¹)"],["n","atomic energy level"],["h","Planck’s constant"]]},
  {t:"quantum",sub:"Spectra",f:"\\dfrac{1}{\\lambda} = R\\left(\\dfrac{1}{n_f^{\\,2}} - \\dfrac{1}{n_i^{\\,2}}\\right)",d:"Rydberg’s equation for the hydrogen spectrum",
   sy:[["\\lambda","wavelength of the emitted light (m)"],["R","Rydberg’s constant (see table)"],["n_f","final energy level"],["n_i","initial energy level"]]},
  {t:"quantum",sub:"Photoelectric",f:"W = hf_0",d:"Work function and threshold frequency",
   sy:[["W","work function of the electron (J)"],["h","Planck’s constant"],["f_0","threshold frequency (Hz)"]]},

  {t:"standard",sub:"Conservation",f:"B = \\tfrac{1}{3}\\left(n_q - n_{\\bar q}\\right)",d:"Baryon number from quark content",
   sy:[["B","baryon number"],["n_q","number of quarks"],["n_{\\bar q}","number of antiquarks"]]},
  {t:"standard",sub:"Conservation",f:"B = n_b - n_{\\bar b}",d:"Baryon number from baryon count",
   sy:[["B","baryon number"],["n_b","number of baryons"],["n_{\\bar b}","number of antibaryons"]]},
  {t:"standard",sub:"Conservation",f:"L = n_l - n_{\\bar l}",d:"Lepton number",
   sy:[["L","lepton number"],["n_l","number of leptons"],["n_{\\bar l}","number of antileptons"]]}
];

/* ---------- Build interactive deck ---------- */
const deck = document.getElementById('deck');
const pad = n => String(n).padStart(2,'0');

CARDS.forEach((c,i)=>{
  const tp = TOPIC[c.t], col = C[c.t], n = pad(i+1);
  const card = document.createElement('button');
  card.className='card'; card.dataset.topic=c.t;
  card.style.setProperty('--c',col);
  card.setAttribute('aria-label',`Card ${i+1}: ${c.d}. Activate to flip.`);
  const symRows = c.sy.map(([s,m])=>`<div class="sym"><span class="s">\\(${s}\\)</span><span>${m}</span></div>`).join('');
  card.innerHTML = `
    <div class="inner">
      <div class="face front">
        <span class="spine"></span>
        <div class="top"><span class="tag">${tp.name} · ${c.sub}</span><span class="unit">${tp.unit}</span></div>
        <div class="formula">\\[${c.f}\\]</div>
        <div class="foot"><span class="num">${n}</span><span class="hint">tap to flip →</span></div>
      </div>
      <div class="face back">
        <span class="spine"></span>
        <div class="head"><div class="k">${tp.name}</div><div class="desc">${c.d}</div></div>
        <div class="syms">${symRows}</div>
        <span class="num">${n}</span>
      </div>
    </div>`;
  card.addEventListener('click',()=>card.classList.toggle('flipped'));
  deck.appendChild(card);
});

/* ---------- Topic filter chips ---------- */
const chips = document.getElementById('chips');
const state = {topics:new Set(Object.keys(TOPIC))};
Object.entries(TOPIC).forEach(([key,tp])=>{
  const b=document.createElement('button');
  b.className='chip'; b.setAttribute('aria-pressed','true');
  b.style.setProperty('--c',C[key]);
  b.innerHTML=`<span class="dot"></span>${tp.name}`;
  b.addEventListener('click',()=>{
    const on=b.getAttribute('aria-pressed')==='true';
    b.setAttribute('aria-pressed',String(!on));
    on?state.topics.delete(key):state.topics.add(key);
    applyFilter();
  });
  chips.appendChild(b);
});
function applyFilter(){
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const vis=state.topics.has(c.dataset.topic);
    c.style.display=vis?'':'none'; if(vis)shown++;
  });
  document.getElementById('count').textContent=`${shown} of ${CARDS.length} cards shown · click a card to flip · use “Print deck” for double-sided cards to cut out`;
}

/* ---------- Flip all ---------- */
const showF=document.getElementById('showF'), showE=document.getElementById('showE');
function setAll(flip){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flipped',flip));
  showF.setAttribute('aria-pressed',String(!flip));
  showE.setAttribute('aria-pressed',String(flip));
}
showF.addEventListener('click',()=>setAll(false));
showE.addEventListener('click',()=>setAll(true));

/* ---------- Print sheets (duplex, back rows mirrored) ---------- */
const COLS=3, ROWS=6, PER=COLS*ROWS;
function buildPrint(){
  const root=document.getElementById('printroot'); root.innerHTML='';
  const note=document.createElement('p'); note.className='pnote';
  note.textContent='Print double-sided (flip on long edge). Fronts and backs are paired; cut along the borders.';
  root.appendChild(note);
  for(let p=0;p<CARDS.length;p+=PER){
    const page=CARDS.slice(p,p+PER);
    // FRONT sheet
    const fs=document.createElement('div'); fs.className='psheet';
    page.forEach((c,idx)=>{
      const n=pad(p+idx+1);
      const el=document.createElement('div'); el.className='pcard'; el.style.setProperty('--c',C[c.t]);
      el.innerHTML=`<span class="pspine"></span><div class="pf"><div class="ptag">${TOPIC[c.t].name}</div><div class="pfx">\\[${c.f}\\]</div><div class="pnum">${n}</div></div>`;
      fs.appendChild(el);
    });
    root.appendChild(fs);
    // BACK sheet — mirror each row so duplex aligns
    const bs=document.createElement('div'); bs.className='psheet';
    const grid=[];
    for(let r=0;r<ROWS;r++){
      const row=page.slice(r*COLS,r*COLS+COLS);
      while(row.length<COLS) row.push(null);
      row.reverse();
      row.forEach((c,ci)=>grid.push({c, origIndex:(row.length-1-ci)+r*COLS}));
    }
    grid.forEach(({c,origIndex})=>{
      const el=document.createElement('div'); el.className='pcard';
      if(!c){el.style.border='none';bs.appendChild(el);return;}
      el.style.setProperty('--c',C[c.t]);
      const n=pad(p+origIndex+1);
      const rows=c.sy.map(([s,m])=>`<div class="prow"><b>\\(${s}\\)</b> ${m}</div>`).join('');
      el.innerHTML=`<span class="pspine"></span><div class="pb"><div class="phead"><div class="pk">${TOPIC[c.t].name} · ${n}</div>${c.d}</div><div class="psy">${rows}</div></div>`;
      bs.appendChild(el);
    });
    root.appendChild(bs);
  }
}
document.getElementById('printBtn').addEventListener('click',async()=>{
  buildPrint();
  if(window.MathJax&&MathJax.typesetPromise){await MathJax.typesetPromise([document.getElementById('printroot')]);}
  window.print();
});

/* ---------- Typeset ---------- */
function typeset(){ if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise();} }
if(window.MathJax&&MathJax.startup){MathJax.startup.promise.then(typeset);} else {window.addEventListener('load',typeset);}
applyFilter();
</script>
